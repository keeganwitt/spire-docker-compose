services:
  spire-server:
    hostname: spire-server
    image: ghcr.io/spiffe/spire-server:${SPIRE_VERSION}
    platform: linux/amd64
    volumes:
      - ./spire/server/conf:/opt/spire/conf/server:r
      - server-socket:/opt/spire/sockets:rw
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    privileged: true
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-verbose"]
      interval: 10s
      timeout: 5s
      retries: 3
  spire-agent:
    hostname: spire-agent
    image: ghcr.io/spiffe/spire-agent:${SPIRE_VERSION}
    platform: linux/amd64
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - ./spire/agent/conf:/opt/spire/conf/agent:r
      - agent-socket:/opt/spire/sockets:rw
      - /var/run/docker.sock:/var/run/docker.sock:r
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    pid: "host"
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/opt/spire/sockets/workload_api.sock", "-verbose"]
      interval: 10s
      timeout: 5s
      retries: 3
  create-entries:
    image: ghcr.io/spiffe/spire-server:${SPIRE_VERSION}
    platform: linux/amd64
    depends_on:
      spire-agent:
        condition: service_healthy
    entrypoint: ["/opt/spire/bin/spire-server"]
    command:
      - entry
      - create
      - -socketPath
      - /opt/spire/sockets/server.sock
      - -selector
      - docker:label:com.docker.compose.service:spire-workload
      - -spiffeID
      - spiffe://example.org/workload/spire-workload
      - -parentID
      - spiffe://example.org/spire/agent/x509pop/02b8e7713492fdf93d43369e9c6f50d28bef9fa8
#      - -parentID
#      - spiffe://example.org/node/agent
    volumes:
      - server-socket:/opt/spire/sockets:r
  spire-workload:
    hostname: spire-workload
    image: ghcr.io/spiffe/spire-agent:${SPIRE_VERSION}
    platform: linux/amd64
    depends_on:
      spire-agent:
        condition: service_healthy
      create-entries:
        condition: service_started
    volumes:
      - agent-socket:/opt/spire/sockets:r
    entrypoint: ["/opt/spire/bin/spire-agent"]
    command: ["api", "fetch", "x509", "-socketPath", "/opt/spire/sockets/workload_api.sock"]
#    command: ["api", "fetch", "jwt", "-audience", "some-audience", "-socketPath", "/opt/spire/sockets/workload_api.sock"]

volumes:
  agent-socket:
  server-socket:
