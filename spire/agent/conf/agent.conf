agent {
    trust_domain = "example.org"
    server_address = "spire-server"
    server_port = "8081"
    data_dir = "/opt/spire/data/agent"
    socket_path ="/opt/spire/sockets/workload_api.sock"
    log_level = "DEBUG"
    # commented out because using insecure_bootstrap
    # trust_bundle_path = "/opt/spire/conf/agent/trust_bundle.pem"
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            certificate_path = "/opt/spire/conf/agent/agent.crt.pem"
            private_key_path = "/opt/spire/conf/agent/agent.key.pem"
        }
    }
    KeyManager "memory" {
        plugin_data {
        }
    }
    WorkloadAttestor "docker" {
        plugin_data {
            docker_socket_path = "unix:///var/run/docker.sock"
            # verbose_container_locator_logs = true
        }
    }
}
